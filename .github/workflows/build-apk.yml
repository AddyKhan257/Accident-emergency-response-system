name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend URL baked into the app (laptop LAN IP)"
        required: true
        default: "http://192.168.1.6:5000"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/aers_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Newer Flutter needs AGP >= 9.1.1; bump only if the repo still has 9.1.0
      - name: Bump AGP if needed
        run: |
          if grep -q '"9.1.0"' android/settings.gradle.kts; then
            sed -i 's/"9\.1\.0"/"9.1.1"/' android/settings.gradle.kts
          fi
          grep -n "com.android.application" android/settings.gradle.kts

      - run: flutter --version
      - run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --android-skip-build-dependency-validation
          --dart-define=API_URL=${{ github.event.inputs.api_url }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk aers-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aers-app
          path: mobile/aers_app/aers-app.apk

      - name: Publish as release (direct .apk download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AERS app build ${{ github.run_number }}
          body: "API_URL = ${{ github.event.inputs.api_url }}"
          files: mobile/aers_app/aers-app.apk